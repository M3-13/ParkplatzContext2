[package]
name = "parkplatz"
version = "0.1.0"
description = "Parkplatz - Kontext-Merker fuer Entwickler"
authors = ["Parkplatz"]
edition = "2021"

[lib]
name = "parkplatz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
dirs = "5"
chrono = "0.4"
notify = "6"

[features]
# This application is a desktop tray utility and must never initiate network
# connections. The default Tauri devtools feature is intentionally disabled.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
