[package]
name = "parkplatz"
version = "0.1.0"
description = "Parkplatz - Kontext-Merker fuer Entwickler"
authors = ["Parkplatz"]
edition = "2021"

[lib]
name = "parkplatz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
chrono = "0.4"
notify = "6"

[features]
# This feature is used for production builds or when a dev server is not
# specified. DO NOT REMOVE! It enables the custom protocol that serves the
# embedded frontend assets. It is enabled by default so that the app starts
# with plain `cargo run --manifest-path src-tauri/Cargo.toml` (no dev server,
# no environment variables) exactly as RUN.json declares.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
